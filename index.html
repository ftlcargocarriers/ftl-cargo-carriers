<!-- QUICK QUOTE FORM SECTION -->
<section id="quote" class="py-16 bg-amber-700 text-white">
    <div class="max-w-4xl mx-auto px-4">
        <div class="text-center space-y-2 mb-10">
            <h2 class="text-3xl font-black">Quick Quote Price</h2>
            <p class="text-amber-100 text-sm">Let's start a price quote on transport</p>
        </div>

        <!-- Inline Success Alert (Hidden by default) -->
        <div id="quote-success-msg" class="hidden mb-6 p-4 rounded-xl bg-emerald-600 text-white font-bold text-center border border-emerald-400 shadow-lg">
            <i class="fa-solid fa-circle-check mr-2 text-xl"></i> Email Sent Successfully! Our team will contact you shortly.
        </div>

        <!-- Inline Error Alert (Hidden by default) -->
        <div id="quote-error-msg" class="hidden mb-6 p-4 rounded-xl bg-red-600 text-white font-bold text-center border border-red-400 shadow-lg">
            <i class="fa-solid fa-triangle-exclamation mr-2 text-xl"></i> Failed to send email. Please try again or call us directly.
        </div>

        <form id="quote-form" onsubmit="handleQuoteSubmit(event)" class="space-y-4 bg-amber-800/60 p-6 sm:p-8 rounded-2xl shadow-2xl border border-amber-600">
            <div>
                <input type="text" id="q-name" required placeholder="Your Name" class="w-full bg-white text-slate-800 text-sm p-3.5 rounded-lg focus:outline-none">
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
                <input type="email" id="q-email" required placeholder="Email Address" class="w-full bg-white text-slate-800 text-sm p-3.5 rounded-lg focus:outline-none">
                <input type="tel" id="q-phone" required placeholder="Phone Number" class="w-full bg-white text-slate-800 text-sm p-3.5 rounded-lg focus:outline-none">
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
                <input type="text" id="q-from" required placeholder="From (e.g., Bangalore)" class="w-full bg-white text-slate-800 text-sm p-3.5 rounded-lg focus:outline-none">
                <input type="text" id="q-to" required placeholder="To (e.g., Delhi)" class="w-full bg-white text-slate-800 text-sm p-3.5 rounded-lg focus:outline-none">
            </div>
            <div>
                <select id="q-vehicle" class="w-full bg-white text-slate-800 text-sm p-3.5 rounded-lg focus:outline-none">
                    <option value="22ft Open Body / Container">22ft Open Body / Container</option>
                    <option value="32ft SXL Container">32ft SXL Container (Single Axle)</option>
                    <option value="32ft MXL Container">32ft MXL Container (Multi Axle)</option>
                    <option value="Other / Full Truck Load">Other Full Truck Load (FTL)</option>
                </select>
            </div>
            <div>
                <textarea id="q-msg" rows="4" placeholder="Message / Cargo Details" class="w-full bg-white text-slate-800 text-sm p-3.5 rounded-lg focus:outline-none"></textarea>
            </div>
            <button type="submit" id="quote-submit-btn" class="w-full bg-brand-red hover:bg-brand-darkRed text-white font-bold py-4 rounded-lg transition shadow-lg uppercase tracking-wider text-sm flex items-center justify-center">
                <span>Submit Quote Request</span>
            </button>
        </form>
    </div>
</section>
